<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · openmuse</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: min(400px, 92vw); padding: 40px 36px; text-align: center;
    background: #171a21; border: 1px solid #262b36; border-radius: 16px;
  }
  .logo { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .logo span { color: #7c8aff; }
  .sub { color: #9aa0b0; font-size: 14px; margin-bottom: 28px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px; margin-bottom: 12px;
    border: 1px solid #333a48; border-radius: 10px;
    background: #1f242e; color: #e8eaf0; font-size: 15px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: #262c38; border-color: #7c8aff; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn svg { width: 20px; height: 20px; }
  .err { color: #ff7b7b; font-size: 13px; min-height: 20px; margin-top: 8px; }
  .note { color: #6b7280; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">open<span>muse</span></div>
  <div class="sub">你的常驻 AI 电脑，请先登录</div>
  <div id="buttons"></div>
  <div class="err" id="err"></div>
  <div class="note">登录即代表你同意将 GitHub / Google 的基本资料用于创建 openmuse 账号</div>
</div>
<script>
// better-auth 1.x 的 /sign-in/social 只支持 POST（返回 authorize URL），
// 因此用 fetch 而不是纯 <a> 链接；无任何打包步骤。
const NAMES = {
  github: { label: '使用 GitHub 登录', icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.26 5.68.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .3.2.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>' },
  google: { label: '使用 Google 登录', icon: '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.26-2.09 3.57-5.16 3.57-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28v-3.1H1.29a12 12 0 0 0 0 10.76l3.98-3.1z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.58 1.8l3.44-3.44A11.97 11.97 0 0 0 12 0 12 12 0 0 0 1.29 6.62l3.98 3.1C6.22 6.88 8.87 4.77 12 4.77z"/></svg>' },
};

async function boot() {
  const box = document.getElementById('buttons');
  const err = document.getElementById('err');
  try {
    const cfg = await (await fetch('/api/auth-config')).json();
    const providers = (cfg.providers || []).filter(p => NAMES[p]);
    if (!providers.length) {
      err.textContent = '登录尚未配置（缺少 OAuth 环境变量），请联系管理员';
      return;
    }
    for (const p of providers) {
      const b = document.createElement('button');
      b.className = 'btn';
      b.innerHTML = NAMES[p].icon + '<span>' + NAMES[p].label + '</span>';
      b.onclick = async () => {
        b.disabled = true;
        err.textContent = '';
        try {
          const r = await fetch('/api/auth/sign-in/social', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: p,
              // 绝对地址：baseURL 所在 origin 自动可信
              callbackURL: location.origin + '/',
            }),
          });
          const d = await r.json();
          if (d.url) {
            location.href = d.url;
          } else {
            err.textContent = '启动登录失败：' + (d.message || r.status);
            b.disabled = false;
          }
        } catch (e) {
          err.textContent = '网络错误：' + e.message;
          b.disabled = false;
        }
      };
      box.appendChild(b);
    }
  } catch (e) {
    err.textContent = '无法加载登录配置：' + e.message;
  }
}
boot();
</script>
</body>
</html>
